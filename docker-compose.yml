services:
  db:
    image: postgres:16-alpine
    container_name: librix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-librix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-librix}
    ports: ["5432:5432"]
    volumes: ["librix_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-librix} -d ${POSTGRES_DB:-librix}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  librix_pgdata:
